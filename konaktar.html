<!DOCTYPE html>
<html lang="kk" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" href="frontend/web/favicon.ico" type="image/png">
    <title>Кімдер келеді? | Мұрат – Эльмира 50 Жас Мерейтойы</title>
    
    <link href="css/default/shablon1.css" rel="stylesheet">
    <link href="assets/cc23a5c6/css/bootstrap.css" rel="stylesheet">
    
    <style>
        :root {
            --gold-primary: #C29F62;
            --gold-dark: #8F6F32;
            --gold-light: #FBF7EE;
            --green-accent: #11682F;
            --text-dark: #2A251D;
        }
        body {
            background-color: #FAF8F5;
            color: var(--text-dark);
            font-family: 'Gilroy-Regular', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }
        .admin-header {
            background: linear-gradient(135deg, #24221D 0%, #363229 100%);
            color: #fff;
            padding: 30px 15px 35px;
            text-align: center;
            border-bottom: 3px solid var(--gold-primary);
            position: relative;
        }
        .admin-title {
            font-family: 'Forum', serif;
            font-size: 32px;
            color: #F8E7BE;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .admin-subtitle {
            font-size: 16px;
            color: #D2C4AE;
            margin-bottom: 15px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #F8E7BE;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(248,231,190,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .back-link:hover {
            background: rgba(255,255,255,0.18);
            color: #fff;
            text-decoration: none;
        }
        .dashboard-container {
            max-width: 900px;
            margin: -20px auto 40px;
            padding: 0 15px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #fff;
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid #ECE7DE;
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
        }
        .stat-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }
        .stat-num {
            font-family: 'Forum', serif;
            font-size: 34px;
            font-weight: bold;
            color: var(--gold-dark);
            line-height: 1.1;
        }
        .stat-label {
            font-size: 13px;
            color: #7A7468;
            margin-top: 4px;
            font-weight: 500;
        }
        .card-main {
            background: #fff;
            border-radius: 20px;
            border: 1px solid #ECE7DE;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            overflow: hidden;
            padding: 20px;
        }
        .tools-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .search-box {
            flex: 1 1 240px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 25px;
            border: 1px solid #DAD5C9;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .search-input:focus {
            border-color: var(--gold-primary);
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-whatsapp {
            background: #25D366;
            color: #fff;
        }
        .btn-whatsapp:hover {
            background: #1EBE5D;
            color: #fff;
        }
        .btn-csv {
            background: var(--gold-primary);
            color: #fff;
        }
        .btn-csv:hover {
            background: var(--gold-dark);
            color: #fff;
        }
        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
            border-bottom: 1px solid #F0ECE4;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #7A7468;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--gold-light);
            color: var(--gold-dark);
            border: 1px solid #E5D5B3;
        }
        .guest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #F3EFE8;
            transition: background 0.15s;
        }
        .guest-item:last-child {
            border-bottom: none;
        }
        .guest-item:hover {
            background: #FDFBF7;
        }
        .guest-num {
            width: 28px;
            height: 28px;
            background: var(--gold-light);
            color: var(--gold-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .guest-name {
            font-size: 16px;
            font-weight: 600;
            color: #2A251D;
            margin-bottom: 2px;
        }
        .guest-date {
            font-size: 12px;
            color: #9E9789;
        }
        .badge-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-align: right;
            flex-shrink: 0;
        }
        .badge-couple {
            background: #E8F5E9;
            color: #1E7E34;
            border: 1px solid #C3E6CB;
        }
        .badge-single {
            background: #E3F2FD;
            color: #1565C0;
            border: 1px solid #BBDEFB;
        }
        .badge-none {
            background: #FFEBEE;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #8E8779;
        }
        .empty-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<header class="admin-header">
    <a href="index.html" class="back-link mb-3">
        ← Шақыру сайтына оралу
    </a>
    <h1 class="admin-title">Мұрат – Эльмира | 50 Жас</h1>
    <div class="admin-subtitle">Тойға расталған қонақтар тізімі (Кімдер келеді)</div>
</header>

<main class="dashboard-container">
    <!-- Статистика блоктары -->
    <div class="stat-grid">
        <div class="stat-card" style="border-top: 4px solid var(--gold-primary);">
            <div class="stat-icon">👥</div>
            <div class="stat-num" id="totalGuestsCount">0</div>
            <div class="stat-label">Барлық адам саны</div>
        </div>
        <div class="stat-card" style="border-top: 4px solid #1E7E34;">
            <div class="stat-icon">👫</div>
            <div class="stat-num" id="coupleCount">0</div>
            <div class="stat-label">Жұбайымен (жұп)</div>
        </div>
        <div class="stat-card" style="border-top: 4px solid #1565C0;">
            <div class="stat-icon">👤</div>
            <div class="stat-num" id="singleCount">0</div>
            <div class="stat-label">Жалғыз келетіндер</div>
        </div>
        <div class="stat-card" style="border-top: 4px solid #C62828;">
            <div class="stat-icon">❌</div>
            <div class="stat-num" id="noneCount">0</div>
            <div class="stat-label">Келе алмайтындар</div>
        </div>
    </div>

    <!-- Негізгі қонақтар карточкасы -->
    <div class="card-main">
        <div class="tools-bar">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Қонақтың аты-жөнін іздеу...">
            </div>
            <div style="display: flex; gap: 8px;">
                <button id="copyWhatsAppBtn" class="btn-action btn-whatsapp" title="WhatsApp-қа көшіру">
                    📋 WhatsApp-қа көшіру
                </button>
                <button id="exportCsvBtn" class="btn-action btn-csv" title="Excel файл жүктеу">
                    📥 Excel (CSV)
                </button>
            </div>
        </div>

        <!-- Фильтр табтары -->
        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">Барлығы (<span id="tabCountAll">0</span>)</button>
            <button class="tab-btn" data-filter="coming">Келетіндер (<span id="tabCountComing">0</span>)</button>
            <button class="tab-btn" data-filter="couple">Жұбайымен 👫 (<span id="tabCountCouple">0</span>)</button>
            <button class="tab-btn" data-filter="single">Жалғыз 👤 (<span id="tabCountSingle">0</span>)</button>
            <button class="tab-btn" data-filter="none">Келмейді ❌ (<span id="tabCountNone">0</span>)</button>
        </div>

        <!-- Қонақтар тізімі -->
        <div id="guestsListContainer">
            <div class="empty-state">
                <div class="empty-icon">⏳</div>
                <h5>Қонақтар жүктелуде...</h5>
            </div>
        </div>
    </div>
</main>

<script src="assets/4773ca/jquery.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD3pODPnNSvm_x6Z6bEu3iCZzPGudqR6b8",
  authDomain: "restoflow-saas-azamat.firebaseapp.com",
  projectId: "restoflow-saas-azamat",
  storageBucket: "restoflow-saas-azamat.firebasestorage.app",
  messagingSenderId: "427871988292",
  appId: "1:427871988292:web:4b20685cd6d9b9bba8ea11"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

let allGuests = [];
let currentFilter = 'all';
let searchQuery = '';

function escapeHtml(text) {
  if (!text) return '';
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function updateStats() {
  let totalPeople = 0;
  let coupleCount = 0;
  let singleCount = 0;
  let noneCount = 0;

  allGuests.forEach(g => {
    if (g.zhauap == '3') {
      coupleCount++;
      totalPeople += 2;
    } else if (g.zhauap == '2') {
      singleCount++;
      totalPeople += 1;
    } else if (g.zhauap == '1') {
      noneCount++;
    }
  });

  $('#totalGuestsCount').text(totalPeople);
  $('#coupleCount').text(coupleCount);
  $('#singleCount').text(singleCount);
  $('#noneCount').text(noneCount);

  $('#tabCountAll').text(allGuests.length);
  $('#tabCountComing').text(coupleCount + singleCount);
  $('#tabCountCouple').text(coupleCount);
  $('#tabCountSingle').text(singleCount);
  $('#tabCountNone').text(noneCount);
}

function renderGuests() {
  const container = $('#guestsListContainer');
  let filtered = allGuests.filter(g => {
    // Filter by tab
    if (currentFilter === 'coming' && g.zhauap == '1') return false;
    if (currentFilter === 'couple' && g.zhauap != '3') return false;
    if (currentFilter === 'single' && g.zhauap != '2') return false;
    if (currentFilter === 'none' && g.zhauap != '1') return false;

    // Filter by search
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const name = (g.name || '').toLowerCase();
      return name.includes(q);
    }
    return true;
  });

  if (filtered.length === 0) {
    if (allGuests.length === 0) {
      container.html(`
        <div class="empty-state">
          <div class="empty-icon">💌</div>
          <h5 style="font-family: 'Forum', serif; font-size: 20px; color: #413522;">Әзірге жауап берген қонақтар жоқ</h5>
          <p style="font-size: 14px;">Шақыру сілтемесі арқылы қонақтар жауап бергенде, бұл тізім автоматты түрде толығады!</p>
        </div>
      `);
    } else {
      container.html(`
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <h5>Іздеу бойынша ешкім табылмады</h5>
        </div>
      `);
    }
    return;
  }

  let html = '';
  filtered.forEach((g, index) => {
    let badgeHtml = '';
    if (g.zhauap == '3') {
      badgeHtml = `<span class="badge-status badge-couple">👫 Жұбайымен (+2)</span>`;
    } else if (g.zhauap == '2') {
      badgeHtml = `<span class="badge-status badge-single">👤 Жалғыз (+1)</span>`;
    } else {
      badgeHtml = `<span class="badge-status badge-none">❌ Келмейді</span>`;
    }

    html += `
      <div class="guest-item">
        <div style="display: flex; align-items: center; min-width: 0;">
          <div class="guest-num">${index + 1}</div>
          <div style="min-width: 0;">
            <div class="guest-name">${escapeHtml(g.name)}</div>
            <div class="guest-date">${escapeHtml(g.date || '')}</div>
          </div>
        </div>
        <div>
          ${badgeHtml}
        </div>
      </div>
    `;
  });

  container.html(html);
}

// Firestore Realtime Listener
db.collection('shaqyru_guests')
  .orderBy('createdAt', 'desc')
  .onSnapshot(snapshot => {
    allGuests = [];
    snapshot.forEach(doc => {
      allGuests.push({ id: doc.id, ...doc.data() });
    });
    updateStats();
    renderGuests();
  }, error => {
    console.error("Guests fetch error:", error);
    $('#guestsListContainer').html(`
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <h5>Деректерді жүктеу қатесі: ${error.message}</h5>
      </div>
    `);
  });

// Filter tab clicks
$('.tab-btn').on('click', function() {
  $('.tab-btn').removeClass('active');
  $(this).addClass('active');
  currentFilter = $(this).data('filter');
  renderGuests();
});

// Search input
$('#searchInput').on('input', function() {
  searchQuery = $.trim($(this).val());
  renderGuests();
});

// WhatsApp Copy
$('#copyWhatsAppBtn').on('click', function() {
  if (allGuests.length === 0) {
    alert('Тізім әзірге бос!');
    return;
  }

  let text = `🎉 МҰРАТ – ЭЛЬМИРА 50 ЖАС МЕРЕЙТОЙЫ\n`;
  text += `📋 РАСТАЛҒАН ҚОНАҚТАР ТІЗІМІ:\n\n`;

  let comingGuests = allGuests.filter(g => g.zhauap != '1');
  let totalPeople = 0;

  comingGuests.forEach((g, i) => {
    let pCount = (g.zhauap == '3') ? '2 адам (жұбайымен)' : '1 адам';
    totalPeople += (g.zhauap == '3') ? 2 : 1;
    text += `${i + 1}. ${g.name} — ${pCount}\n`;
  });

  text += `\n👥 Барлық келетін адам саны: ${totalPeople} адам\n`;

  let nonComing = allGuests.filter(g => g.zhauap == '1');
  if (nonComing.length > 0) {
    text += `\n❌ Келе алмайтындар:\n`;
    nonComing.forEach((g, i) => {
      text += `- ${g.name}\n`;
    });
  }

  navigator.clipboard.writeText(text).then(() => {
    alert('Тізім WhatsApp-қа жіберу үшін көшірілді! 📋');
  }).catch(() => {
    alert('Көшіру мүмкін болмады, қолмен көшіріңіз.');
  });
});

// Export CSV
$('#exportCsvBtn').on('click', function() {
  if (allGuests.length === 0) {
    alert('Тізім әзірге бос!');
    return;
  }

  let csvContent = "\uFEFF№,Аты-жөні,Жауабы,Адам саны,Күні\n";
  allGuests.forEach((g, i) => {
    let status = (g.zhauap == '3') ? 'Жұбайымен' : (g.zhauap == '2') ? 'Жалғыз' : 'Келмейді';
    let count = (g.zhauap == '3') ? '2' : (g.zhauap == '2') ? '1' : '0';
    let name = (g.name || '').replace(/"/g, '""');
    csvContent += `${i + 1},"${name}","${status}","${count}","${g.date || ''}"\n`;
  });

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Murat_Elmira_Konaktar_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});
</script>

</body>
</html>
